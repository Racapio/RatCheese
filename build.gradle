plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Load the per-Minecraft-version dependency set (versions/<mc>.properties).
def mcTarget = project.property('mc')
def versionFile = file("versions/${mcTarget}.properties")
if (!versionFile.exists()) {
	throw new GradleException("Unsupported Minecraft target '${mcTarget}': missing ${versionFile}")
}
def target = new Properties()
versionFile.withInputStream { target.load(it) }

version = "${project.mod_version}+${target.minecraft_version}"
group = project.maven_group

repositories {
	exclusiveContent {
		forRepository {
			maven { url = "https://maven.terraformersmc.com/releases" }
		}
		filter {
			includeGroup "com.terraformersmc"
		}
	}
}

// Version-specific bridge code (see src/compat/*/java/com/ratcheese/compat/Mc.java).
sourceSets.main.java.srcDir("src/compat/${target.compat}/java")

loom {
	mods {
		"ratcheese" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${target.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${target.fabric_api_version}"

	// Mod Menu integration (config screen entry)
	implementation "com.terraformersmc:modmenu:${target.mod_menu_version}"
}

processResources {
	def props = [version: project.mod_version, minecraft: target.minecraft_dependency]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
