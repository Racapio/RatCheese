name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build for Minecraft ${{ matrix.mc }}
        run: |
          chmod +x gradlew
          ./gradlew build -Pmc=${{ matrix.mc }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ratcheese-${{ matrix.mc }}
          path: build/libs/*.jar
